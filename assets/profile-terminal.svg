<svg width="1000" height="420" viewBox="0 0 1000 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated terminal profile banner for Mykola Kosmachevskyi</title>
  <desc id="desc">A terminal-style animated GitHub profile header showing Mykola's .NET developer role, backend stack, frontend tools, and contact prompt.</desc>
  <style>
    :root { color-scheme: dark; }
    .panel { fill: #0b1020; stroke: #26324d; stroke-width: 1.5; }
    .topbar { fill: #121a2d; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .muted { fill: #8ea0c8; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .prompt { fill: #22d3b4; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; }
    .text { fill: #e5edf8; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .accent { fill: #93c5fd; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; }
    .chip { fill: #111827; stroke: #334155; stroke-width: 1; }
    .chipText { fill: #cbd5e1; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; }
    .grid { stroke: #1f2a44; stroke-width: 1; opacity: .55; }
    .line { opacity: 0; animation: reveal .7s ease forwards; }
    .line2 { animation-delay: .35s; }
    .line3 { animation-delay: .7s; }
    .line4 { animation-delay: 1.05s; }
    .line5 { animation-delay: 1.4s; }
    .cursor { animation: blink .9s steps(2, start) infinite; }
    .scan { fill: url(#scanGradient); animation: scan 4.5s ease-in-out infinite; opacity: .55; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
    .floatA { animation: floatA 6s ease-in-out infinite; }
    .floatB { animation: floatB 7s ease-in-out infinite; }
    @keyframes reveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
    @keyframes scan { 0% { transform: translateY(-190px); } 50% { transform: translateY(190px); } 100% { transform: translateY(-190px); } }
    @keyframes pulse { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
    @keyframes floatA { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes floatB { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070b16" />
      <stop offset="0.48" stop-color="#101827" />
      <stop offset="1" stop-color="#052e2b" />
    </linearGradient>
    <linearGradient id="scanGradient" x1="0" y1="0" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3b4" stop-opacity="0" />
      <stop offset="0.5" stop-color="#22d3b4" stop-opacity="0.18" />
      <stop offset="1" stop-color="#22d3b4" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="420" rx="26" fill="url(#bg)" />
  <g opacity="0.28">
    <path class="grid" d="M70 60H930M70 110H930M70 160H930M70 210H930M70 260H930M70 310H930M70 360H930" />
    <path class="grid" d="M100 42V378M180 42V378M260 42V378M340 42V378M420 42V378M500 42V378M580 42V378M660 42V378M740 42V378M820 42V378M900 42V378" />
  </g>
  <rect class="scan" x="44" y="165" width="912" height="90" rx="26" />
  <circle class="floatA" cx="825" cy="108" r="82" fill="#22d3b4" opacity="0.1" filter="url(#glow)" />
  <circle class="floatB" cx="150" cy="318" r="60" fill="#60a5fa" opacity="0.11" filter="url(#glow)" />

  <rect x="56" y="52" width="888" height="316" rx="18" class="panel" />
  <rect x="56" y="52" width="888" height="48" rx="18" class="topbar" />
  <rect x="56" y="82" width="888" height="18" class="topbar" />
  <circle cx="88" cy="76" r="8" class="dot-red" />
  <circle cx="114" cy="76" r="8" class="dot-yellow" />
  <circle cx="140" cy="76" r="8" class="dot-green" />
  <text x="498" y="82" text-anchor="middle" class="muted" font-size="16">mykola@github: ~/profile</text>

  <g class="line line1">
    <text x="92" y="144" class="prompt" font-size="24">$ whoami</text>
    <text x="92" y="181" class="accent" font-size="34">Mykola Kosmachevskyi</text>
  </g>
  <g class="line line2">
    <text x="92" y="224" class="prompt" font-size="24">$ role</text>
    <text x="190" y="224" class="text" font-size="24">.NET Developer - backend APIs, integrations, React UI</text>
  </g>
  <g class="line line3">
    <text x="92" y="264" class="prompt" font-size="24">$ stack</text>
    <text x="200" y="264" class="text" font-size="24">ASP.NET Core / EF Core / PostgreSQL / JWT / TypeScript</text>
  </g>
  <g class="line line4">
    <rect x="92" y="296" width="112" height="38" rx="10" class="chip pulse" />
    <text x="148" y="321" text-anchor="middle" class="chipText">.NET 6-10</text>
    <rect x="218" y="296" width="92" height="38" rx="10" class="chip pulse" />
    <text x="264" y="321" text-anchor="middle" class="chipText">C#</text>
    <rect x="324" y="296" width="148" height="38" rx="10" class="chip pulse" />
    <text x="398" y="321" text-anchor="middle" class="chipText">PostgreSQL</text>
    <rect x="486" y="296" width="116" height="38" rx="10" class="chip pulse" />
    <text x="544" y="321" text-anchor="middle" class="chipText">React</text>
    <rect x="616" y="296" width="154" height="38" rx="10" class="chip pulse" />
    <text x="693" y="321" text-anchor="middle" class="chipText">TypeScript</text>
    <rect x="784" y="296" width="92" height="38" rx="10" class="chip pulse" />
    <text x="830" y="321" text-anchor="middle" class="chipText">APIs</text>
  </g>
  <g class="line line5">
    <text x="92" y="356" class="prompt" font-size="20">$ contact --telegram</text>
    <text x="314" y="356" class="text" font-size="20">t.me/mykola_kosmachevskyi</text>
    <rect x="626" y="339" width="12" height="23" rx="2" fill="#22d3b4" class="cursor" />
  </g>
</svg>
